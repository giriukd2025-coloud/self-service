trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.11'
  requestFile: onboarding/infra-requests/sales-analytics-basics.yaml
  requestEnvironment: dev
  azureServiceConnection: REPLACE_WITH_AZURE_SERVICE_CONNECTION
  terraformStateResourceGroup: REPLACE_WITH_TF_STATE_RESOURCE_GROUP
  terraformStateStorageAccount: REPLACE_WITH_TF_STATE_STORAGE_ACCOUNT
  terraformStateContainer: tfstate
  terraformStateKey: self-service-platform.tfstate

stages:
  - stage: Validate
    displayName: Validate request and security gates
    jobs:
      - job: RequestChecks
        displayName: Validate self-service request
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: python -m pip install --disable-pip-version-check pyyaml jsonschema
            displayName: Install validation dependencies

          - script: python scripts/validate_request.py
            displayName: Validate request schema

          - script: |
              for request in onboarding/infra-requests/*.yaml; do
                python scripts/check_request_guardrails.py "$request"
              done
            displayName: Enforce request security gates

          - script: |
              terraform fmt -check -recursive terraform
            displayName: Check Terraform formatting

          - script: |
              terraform init -backend=false terraform
              terraform validate terraform
            displayName: Validate approved Terraform catalog

          - script: |
              docker run --rm -v "$(Build.SourcesDirectory):/src" aquasec/trivy:latest \
                config --exit-code 1 --severity HIGH,CRITICAL /src/terraform
            displayName: Run infrastructure security scan

  - stage: Dev
    displayName: Provision development resources
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['requestEnvironment'], 'dev'))
    jobs:
      - deployment: DevProvision
        environment: self-service-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.9.8'
                - task: AzureCLI@2
                  displayName: Plan and apply approved dev request
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python -m pip install --disable-pip-version-check pyyaml
                      python scripts/render_request_tfvars.py "$(requestFile)" --environment dev --output terraform/dev.auto.tfvars
                      subscription_id="$(az account show --query id -o tsv)"
                      terraform -chdir=terraform init \
                        -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                        -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                        -backend-config="container_name=$(terraformStateContainer)" \
                        -backend-config="key=$(terraformStateKey)-dev"
                      terraform -chdir=terraform plan -var="subscription_id=$subscription_id" -out=dev.tfplan
                      terraform -chdir=terraform apply -auto-approve dev.tfplan

  - stage: Test
    displayName: Provision test resources
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['requestEnvironment'], 'test'))
    jobs:
      - deployment: TestProvision
        environment: self-service-test
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.9.8'
                - task: AzureCLI@2
                  displayName: Plan and apply approved test request
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python -m pip install --disable-pip-version-check pyyaml
                      python scripts/render_request_tfvars.py "$(requestFile)" --environment test --output terraform/test.auto.tfvars
                      subscription_id="$(az account show --query id -o tsv)"
                      terraform -chdir=terraform init \
                        -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                        -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                        -backend-config="container_name=$(terraformStateContainer)" \
                        -backend-config="key=$(terraformStateKey)-test"
                      terraform -chdir=terraform plan -var="subscription_id=$subscription_id" -out=test.tfplan
                      terraform -chdir=terraform apply -auto-approve test.tfplan

  - stage: Prod
    displayName: Provision production resources
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['requestEnvironment'], 'prod'))
    jobs:
      - deployment: ProdProvision
        environment: self-service-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.9.8'
                - task: AzureCLI@2
                  displayName: Plan and apply approved production request
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      python -m pip install --disable-pip-version-check pyyaml
                      python scripts/render_request_tfvars.py "$(requestFile)" --environment prod --output terraform/prod.auto.tfvars
                      subscription_id="$(az account show --query id -o tsv)"
                      terraform -chdir=terraform init \
                        -backend-config="resource_group_name=$(terraformStateResourceGroup)" \
                        -backend-config="storage_account_name=$(terraformStateStorageAccount)" \
                        -backend-config="container_name=$(terraformStateContainer)" \
                        -backend-config="key=$(terraformStateKey)-prod"
                      terraform -chdir=terraform plan -var="subscription_id=$subscription_id" -out=prod.tfplan
                      terraform -chdir=terraform apply -auto-approve prod.tfplan